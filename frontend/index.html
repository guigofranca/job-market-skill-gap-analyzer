    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Browser bar in the header's color; useTheme keeps it in step with the theme toggle. -->
    <meta name="theme-color" content="#0f1a19" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />

      name="description"

    />
    <title>Empregos e Tendências</title>

    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Empregos e Tendências" />
    <meta
      property="og:title"
      content="Empregos e Tendências: o que as vagas de Estágio e Júnior pedem"

      property="og:description"
      content="Competências mais exigidas em vagas reais de Estágio e Júnior em Dados, Automação, Desenvolvimento e Infraestrutura, e o que falta no seu perfil."
    />
