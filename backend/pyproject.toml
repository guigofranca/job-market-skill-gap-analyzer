[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "job-market-skill-gap-analyzer"
version = "0.1.0"
description = "ETL + API que mede as competências mais exigidas em vagas de Estágio e Júnior (Dados, Automação e Desenvolvimento)."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pandas>=2.2,<4",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.7,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "pip-audit>=2.7",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]

[project.scripts]
job-analyzer = "job_analyzer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
job_analyzer = ["py.typed"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F",  # pycodestyle / pyflakes
    "I",            # isort
    "N",            # pep8-naming
    "UP",           # pyupgrade
    "B",            # bugbear
    "S",            # bandit (security)
    "BLE",          # blind except
    "C4",           # comprehensions
    "DTZ",          # timezone-aware datetimes
    "SIM",          # simplify
    "PT",           # pytest style
    "PL",           # pylint
    "RUF",          # ruff-specific
]
ignore = [
    "PLR0913",  # too many arguments (pydantic/dataclass constructors)
    "PLR2004",  # magic values in comparisons
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR0913", "S105", "S106"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
filterwarnings = ["error::DeprecationWarning:job_analyzer.*"]

[tool.coverage.run]
source = ["job_analyzer"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
